[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reynard"
version = "3.0.0"
description = "Autonomous web security researcher for authorized pentests, bug bounties, and CTF/lab benchmarks"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.5.0",
  "anthropic>=0.40.0",
  "playwright>=1.40.0",
]

# Optional extras. The base install works without these: local RAG
# (core/knowledge.py) auto-falls back to a pure-Python BM25 retriever, and the
# Ollama embedding backend needs no PyPI dependency (just OLLAMA_BASE_URL).
[project.optional-dependencies]
rag = [
  "sentence-transformers>=2.2.0",  # local all-MiniLM-L6-v2 embeddings
  "numpy>=1.24.0",
]

# Optional external capability providers. The base install works without these:
# both integrations degrade to available=False when their package/server is
# absent. Browser Use is a Python library (semantic workflow discovery);
# HexStrike AI is a separately-run MCP/HTTP server (specialist tools) — no PyPI
# dependency, configured via HEXSTRIKE_SERVER_URL.
external = [
  "browser-use>=0.13",
]

# Optional local web console (run harness). The base install and all CLIs work
# without these; only `reynard-harness` needs them.
harness = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
reynard = "hacking_agent.cli.agent:main"
reynard-orchestrator = "hacking_agent.cli.orchestrator:main"
reynard-lab-eval = "hacking_agent.cli.lab_eval:main"
reynard-assess = "hacking_agent.cli.assess:main"
reynard-harness = "hacking_agent.harness.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hacking_agent.harness.ui" = ["*.html"]
