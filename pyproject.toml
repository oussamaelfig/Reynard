[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reynard"
version = "2.1.0"
description = "Autonomous CTF and authorized web security testing agent"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "rich>=13.7.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.5.0",
  "anthropic>=0.40.0",
  "playwright>=1.40.0",
]

# Optional extras. The base install works without these: local RAG
# (core/knowledge.py) auto-falls back to a pure-Python BM25 retriever, and the
# Ollama embedding backend needs no PyPI dependency (just OLLAMA_BASE_URL).
[project.optional-dependencies]
rag = [
  "sentence-transformers>=2.2.0",  # local all-MiniLM-L6-v2 embeddings
  "numpy>=1.24.0",
]

[project.scripts]
reynard = "hacking_agent.cli.agent:main"
reynard-orchestrator = "hacking_agent.cli.orchestrator:main"
reynard-lab-eval = "hacking_agent.cli.lab_eval:main"
reynard-assess = "hacking_agent.cli.assess:main"

[tool.setuptools.packages.find]
where = ["src"]
