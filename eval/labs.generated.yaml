  - name: "Reflected DOM XSS"
    target: "TODO_LIVE_INSTANCE_URL"
    objective: "This lab demonstrates a reflected DOM vulnerability. Reflected DOM vulnerabilities occur when the server-side application processes data from a request and echoes the data in the response. A script on the page then processes the reflected data in an unsafe way, ultimately writing it to a dangerous sink. To solve this lab, create an injection that calls the alert() function. To solve this lab, enter the following search term: As you have injected a backslash and the site isn't escaping them, when the JSON response attempts to escape the opening double-quotes character, it adds a second backslash. The resulting double-backslash causes the escaping to be effectively canceled out. This means that the double-quotes are processed unescaped, which closes the string that should contain the search term."
    expected_vuln: "xss"
    level: "PRACTITIONER"
    lab_url: "https://portswigger.net/web-security/cross-site-scripting/dom-based/lab-dom-xss-reflected"
    subvariant: "dom-based"

