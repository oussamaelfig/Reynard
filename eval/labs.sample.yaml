# =============================================================================
# Reynard — Live solve-rate eval config (sample)
# =============================================================================
# Run with:
#   reynard-lab-eval --live --config eval/labs.sample.yaml
#   reynard-lab-eval --live --config eval/labs.sample.yaml --per-lab-timeout 600
#
# Each lab runs the real multi-agent Orchestrator and is scored solved/unsolved
# from the `lab_solved` fact or a verified PoC. Results are written as JSON + a
# markdown scorecard under logs/.
#
# NEVER hardcode secrets here. Credentials use ${ENV_VAR} placeholders that are
# expanded from the environment (or your .env) at run time. For PortSwigger labs
# the default academy credentials are wiener:peter — export them, e.g.:
#   export PORTSWIGGER_USERNAME=wiener
#   export PORTSWIGGER_PASSWORD=peter
#
# Replace the 0aXXXX target hostnames below with your live lab instance URLs.
# =============================================================================

labs:
  - name: "SQL injection login bypass"
    target: "https://0aXXXXXXXXXXXXXXXX.web-security-academy.net/"
    objective: >-
      SQL injection vulnerability in the login form. Bypass authentication and
      log in as the administrator user.
    expected_vuln: "sqli"
    max_iterations: 30

  - name: "Access control IDOR"
    target: "https://0aYYYYYYYYYYYYYYYY.web-security-academy.net/"
    objective: >-
      Insecure direct object reference exposes another user's account page.
      Access the administrator account and delete the user carlos.
    expected_vuln: "access_control_idor"
    max_iterations: 30
    creds:
      username: "${PORTSWIGGER_USERNAME}"
      password: "${PORTSWIGGER_PASSWORD}"
