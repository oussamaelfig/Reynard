# =============================================================================
# Reynard — Docker Compose Configuration
# =============================================================================
# Launches the headless Kali container with all necessary capabilities
# and persistent storage for the Reynard agent.
#
# Usage:
#   docker compose up -d          # Start container
#   docker compose down           # Stop container
#   docker compose logs -f kali   # View logs
# =============================================================================

services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile
      # Optional tool profiles. The default image is a lean WEB runtime; flip a
      # profile to "1" (here or via `--build-arg`) to add CTF/binary, mobile,
      # wireless, forensics, Metasploit, or the Z4nzu meta-toolkit.
      args:
        PROFILE_PWN: "0"
        PROFILE_MOBILE: "0"
        PROFILE_WIRELESS: "0"
        PROFILE_FORENSICS: "0"
        PROFILE_METASPLOIT: "0"
        PROFILE_HACKINGTOOL: "0"
    container_name: reynard-kali
    hostname: kali-agent
    
    # -------------------------------------------------------------------------
    # Networking: host mode for full network access (required for pentesting)
    # -------------------------------------------------------------------------
    network_mode: host
    
    # -------------------------------------------------------------------------
    # Capabilities: required for raw sockets, network manipulation, etc.
    # -------------------------------------------------------------------------
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    
    # -------------------------------------------------------------------------
    # Security: allow ptrace for debugging (needed by some tools)
    # -------------------------------------------------------------------------
    security_opt:
      - seccomp=unconfined
    
    # -------------------------------------------------------------------------
    # Persistent volumes: state survives container restarts
    # -------------------------------------------------------------------------
    volumes:
      - agent-data:/data
      - ./methodologies:/data/methodologies:ro
    
    # -------------------------------------------------------------------------
    # Environment
    # -------------------------------------------------------------------------
    environment:
      - TERM=xterm-256color
    
    # -------------------------------------------------------------------------
    # Resource limits (adjust as needed)
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    
    # -------------------------------------------------------------------------
    # Always restart unless explicitly stopped
    # -------------------------------------------------------------------------
    restart: unless-stopped

volumes:
  agent-data:
    driver: local
