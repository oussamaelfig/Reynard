<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- @include head -->
    <title>Contact — Fiona</title>
    <meta name="description" content="Get in touch with Fiona about internships, finance, data or growth." />
    <script type="module" src="/src/pages/basic.js"></script>
  </head>

  <body data-theme="light">
    <!-- @include transition -->
    <!-- @include header -->

    <main id="main" class="contact-page container">
      <p class="eyebrow">Contact</p>

      <h1 class="contact-page__title page-title">
        <span class="line-mask"><span>Let's talk</span></span>
        <span class="line-mask"><span>finance &amp; growth.</span></span>
      </h1>

      <p class="contact-page__intro" data-reveal>Internships, projects or a coffee chat — my inbox is open.</p>

      <div class="contact-page__email-row" data-reveal>
        <a class="contact-page__email" href="mailto:hello@example.com">hello@example.com</a>
        <button class="contact-page__copy" type="button" data-copy="hello@example.com" data-copied-label="Copied!">
          Copy email
        </button>
      </div>

      <div class="contact-page__grid" data-reveal>
        <div>
          <h2 class="eyebrow">Find me online</h2>
          <ul class="contact-page__links">
            <li>
              <a class="text-link" href="https://www.linkedin.com/in/your-handle/" target="_blank" rel="noreferrer">
                LinkedIn ↗
              </a>
            </li>
          </ul>
        </div>

        <div>
          <h2 class="eyebrow">Local time</h2>
          <p class="contact-page__clock"><time data-clock>--:--</time> — San Jose, CA</p>
        </div>
      </div>
    </main>

    <!-- @include footer -->
  </body>
</html>
