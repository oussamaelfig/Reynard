<script>
  ;(() => {
    const root = document.documentElement
    root.classList.add('js')
    try {
      if (sessionStorage.getItem('transition:pending') === '1') {
        sessionStorage.removeItem('transition:pending')
        root.dataset.transition = 'in'
      }
    } catch {}
  })()
</script>
