<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- @include head -->
    <title>Playground — Fiona</title>
    <meta name="description" content="A small physics toy made from the keywords of Fiona's path." />
    <script type="module" src="/src/pages/playground.js"></script>
  </head>

  <body data-theme="dark" class="playground-page">
    <!-- @include transition -->
    <!-- @include header -->

    <main id="main" class="playground">
      <canvas
        class="playground__canvas"
        role="img"
        aria-label="Interactive physics playground"
        data-words="Finance, Data science, Growth, Financial math, Waterloo, Venu, Phydata, YC W21, San Jose, Startups, Physical AI, Internships"
      ></canvas>

      <div class="playground__intro">
        <h1 class="playground__title page-title">
          <span class="line-mask"><span>Playground</span></span>
        </h1>
        <p class="playground__text">My path so far, in words you can throw around.</p>
      </div>

      <div class="playground__bar">
        <p class="playground__hint">
          <span class="playground__hint-mouse">Drag the words · Click to add more · Scroll to flip gravity</span>
          <span class="playground__hint-touch">Drag the words · Tap to add more</span>
        </p>
        <div class="playground__actions">
          <button class="playground__button" type="button" data-gravity-flip>Flip gravity</button>
          <button class="playground__button" type="button" data-reset>Reset</button>
        </div>
      </div>
    </main>
  </body>
</html>
